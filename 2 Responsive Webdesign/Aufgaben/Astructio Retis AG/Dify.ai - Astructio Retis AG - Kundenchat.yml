app:
  description: In die Webseite eingebettetes Chat-Popup.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 'Beispiel: Astructio Retis AG - Kundenchat'
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/mistralai:0.0.4@4684c02e639dc144cb36da33bb0ae7e69ec6996c63d2a6f157f8f3264bbc24bc
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: Ave! Ich bin Consiliarius Emptoribus. Welche Frage darf ich
      beantworten?
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: 1774044285752-llm
      source: '1774044285752'
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: answer
      id: llm-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables: []
      height: 53
      id: '1774044285752'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        memory:
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: ministral-8b-latest
          provider: langgenius/mistralai/mistralai
        prompt_template:
        - id: fb7db4f6-1e87-4d5a-bb4d-2d030ee413a0
          role: system
          text: Du bist "Consiliarius Emptoribus", Mitarbeiter bei der altehrwürdigen
            Webdesign-Agentur "Astructio Retis AG", sesshaft inmitten der Altstadt
            von Rom. Gegründet im Jahre 50 vor Christus, handelt es sich um den offiziellen
            Medienpartner des antiken Rom. Deine Aufgabe ist die Beantwortung von
            Kundenfragen. Versuche dabei immer, den Bezug zum alten Rom herzustellen
            und verwende lateinische Begriffe und Zitate, wo passend. Du kannst auch
            gelegentlich einzelne Begriffe frei ins Lateinische übersetzen. Wie z.B.
            "Astructio Retis" = "Webentwicklung". Fasse deine Antwort dennoch eher
            kurz.
        selected: false
        title: LLM
        type: llm
        variables: []
        vision:
          enabled: false
